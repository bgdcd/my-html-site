name: 学术智库基础检查

on:
  push:
    paths:
      - "academic-research/**"
      - ".github/workflows/academic-research.yml"
  pull_request:
    paths:
      - "academic-research/**"
      - ".github/workflows/academic-research.yml"
  workflow_dispatch:

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academic
          POSTGRES_PASSWORD: academic_test_password
          POSTGRES_DB: academic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U academic -d academic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ACADEMIC_DATABASE_URL: postgresql+psycopg://academic:academic_test_password@localhost:5432/academic_test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r academic-research/requirements.txt
      - name: 检查 Python 语法
        run: python -m compileall -q academic-research/backend academic-research/backup_data.py academic-research/migrate_sqlite_to_postgres.py
      - name: 检查前端脚本语法
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("academic-research/frontend/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "未找到前端脚本"
          Path("/tmp/academic-research-frontend.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/academic-research-frontend.js
      - name: 检查应用可导入和路由
        working-directory: academic-research
        run: |
          python - <<'PY'
          from backend.main import app, engine, Paper, ResearchArea, EvidenceCard, ReviewProject, ReviewParagraph, EvidenceDraftInput, AIReviewDraftInput, SessionLocal, User, AuditLog
          from fastapi.testclient import TestClient
          from sqlalchemy import select
          import json
          paths = {route.path for route in app.routes}
          required = {"/", "/api/health", "/api/areas", "/api/areas/{area_id}/move",
                      "/api/areas/{area_id}/merge", "/api/upload", "/api/papers",
                      "/api/papers/{paper_id}/metadata", "/api/papers/{paper_id}/area", "/api/search/fulltext",
                      "/api/search/external", "/api/papers/{paper_id}/evidence", "/api/evidence/{evidence_id}", "/api/review/evidence-matrix", "/api/review/projects", "/api/review/projects/{project_id}", "/api/review/projects/{project_id}/paragraphs", "/api/review/paragraphs/{paragraph_id}", "/api/review/projects/{project_id}/export.docx", "/api/knowledge-graph", "/api/research-themes", "/api/research-analysis", "/api/review/evidence-draft", "/api/ai/status", "/api/ai/review-draft", "/api/security/status", "/api/auth/status", "/api/auth/register", "/api/auth/login", "/api/auth/me", "/api/auth/logout", "/api/auth/change-password", "/api/account/integrity", "/api/account/export.zip", "/api/admin/users", "/api/admin/users/{user_id}/status", "/api/admin/users/{user_id}/reset-password", "/api/admin/audit-logs", "/api/stats"}
          missing = required - paths
          assert not missing, f"缺少接口: {missing}"
          assert engine is not None and Paper.__tablename__ == "papers"
          assert engine.dialect.name == "postgresql", f"CI应使用PostgreSQL验证，实际为 {engine.dialect.name}"
          assert ResearchArea.__tablename__ == "research_areas"
          assert EvidenceCard.__tablename__ == "evidence_cards"
          assert ReviewProject.__tablename__ == "review_projects"
          assert ReviewParagraph.__tablename__ == "review_paragraphs"
          assert any(route.path == "/api/review/projects/{project_id}/export.docx" for route in app.routes)
          assert any(route.path == "/api/knowledge-graph" for route in app.routes)
          assert any(route.path == "/api/research-themes" for route in app.routes)
          assert any(route.path == "/api/research-analysis" for route in app.routes)
          assert any(route.path == "/api/review/evidence-draft" for route in app.routes)
          assert any(route.path == "/api/ai/status" for route in app.routes)
          assert any(route.path == "/api/ai/review-draft" for route in app.routes)
          assert any(route.path == "/api/security/status" for route in app.routes)
          from backend.main import security_status
          assert "access_control_enabled" in security_status()
          client = TestClient(app)
          assert client.get("/api/security/status").status_code == 200
          import os
          previous_token = os.environ.get("ACADEMIC_ACCESS_TOKEN")
          os.environ["ACADEMIC_ACCESS_TOKEN"] = "ci-test-token-with-sufficient-length"
          assert client.get("/api/stats").status_code == 401
          assert client.get("/api/stats", headers={"Authorization": "Bearer ci-test-token-with-sufficient-length"}).status_code == 200
          bad_pdf = client.post("/api/upload", files={"file": ("fake.pdf", b"not a PDF", "application/pdf")}, headers={"Authorization": "Bearer ci-test-token-with-sufficient-length"})
          assert bad_pdf.status_code == 400, bad_pdf.text
          bad_docx = client.post("/api/upload", files={"file": ("fake.docx", b"not a DOCX", "application/vnd.openxmlformats-officedocument.wordprocessingml.document")}, headers={"Authorization": "Bearer ci-test-token-with-sufficient-length"})
          assert bad_docx.status_code == 400, bad_docx.text
          if previous_token is None:
              os.environ.pop("ACADEMIC_ACCESS_TOKEN", None)
          else:
              os.environ["ACADEMIC_ACCESS_TOKEN"] = previous_token
          assert client.get("/api/stats").status_code == 503
          previous_bootstrap = os.environ.get("ACADEMIC_BOOTSTRAP_CODE")
          previous_invite = os.environ.get("ACADEMIC_REGISTRATION_CODE")
          os.environ["ACADEMIC_BOOTSTRAP_CODE"] = "ci-bootstrap-secret-2026"
          os.environ["ACADEMIC_REGISTRATION_CODE"] = "ci-invite-secret-2026"
          first = client.post("/api/auth/register", json={"username": "account_alpha", "password": "TestPass#2026-Strong", "registration_code": "ci-bootstrap-secret-2026"})
          assert first.status_code == 200, first.text
          token_a = first.json()["access_token"]
          assert first.json()["user"]["role"] == "admin"
          with SessionLocal() as db:
              user_a = db.scalar(select(User).where(User.username == "account_alpha"))
              private_paper = Paper(owner_id=user_a.id, title="仅账号甲可见的论文")
              db.add(private_paper)
              db.flush()
              private_paper_id = private_paper.id
              private_evidence = EvidenceCard(owner_id=user_a.id, paper_id=private_paper_id,
                                              claim="账号甲的真实证据记录", source_text="这是导出测试用的原文摘录")
              db.add(private_evidence)
              db.flush()
              private_project = ReviewProject(owner_id=user_a.id, title="账号甲的综述项目", topic="测试主题")
              db.add(private_project)
              db.flush()
              db.add(ReviewParagraph(owner_id=user_a.id, project_id=private_project.id,
                                     heading="综述段落", content="仅属于账号甲的写作内容",
                                     evidence_ids=json.dumps([private_evidence.id], ensure_ascii=False)))
              db.commit()
          second = client.post("/api/auth/register", json={"username": "account_beta", "password": "TestPass#2026-Another", "registration_code": "ci-invite-secret-2026"})
          assert second.status_code == 200, second.text
          token_b = second.json()["access_token"]
          papers_a = client.get("/api/papers", headers={"Authorization": "Bearer " + token_a})
          papers_b = client.get("/api/papers", headers={"Authorization": "Bearer " + token_b})
          assert any(item["id"] == private_paper_id for item in papers_a.json()), papers_a.text
          assert all(item["id"] != private_paper_id for item in papers_b.json()), papers_b.text
          import io, zipfile, fitz
          pdf_doc = fitz.open()
          page = pdf_doc.new_page()
          page.insert_text((72, 72), "Personal export original file verification")
          pdf_bytes = pdf_doc.tobytes()
          pdf_doc.close()
          uploaded_original = client.post("/api/upload", headers={"Authorization": "Bearer " + token_a}, files={"file": ("account-export-original.pdf", pdf_bytes, "application/pdf")})
          assert uploaded_original.status_code == 200, uploaded_original.text
          export_a = client.get("/api/account/export.zip", headers={"Authorization": "Bearer " + token_a})
          assert export_a.status_code == 200 and export_a.headers["content-type"] == "application/zip"
          with zipfile.ZipFile(io.BytesIO(export_a.content)) as archive:
              names = set(archive.namelist())
              assert {"manifest.json", "account.json", "papers.json", "evidence_cards.json", "review_projects.json", "review_paragraphs.json"}.issubset(names)
              assert "仅账号甲可见的论文" in archive.read("papers.json").decode("utf-8")
              assert "账号甲的真实证据记录" in archive.read("evidence_cards.json").decode("utf-8")
              assert "账号甲的综述项目" in archive.read("review_projects.json").decode("utf-8")
              assert any(name.startswith("original_files/") and name.endswith("account-export-original.pdf") for name in names)
          export_b = client.get("/api/account/export.zip", headers={"Authorization": "Bearer " + token_b})
          with zipfile.ZipFile(io.BytesIO(export_b.content)) as archive:
              assert "仅账号甲可见的论文" not in archive.read("papers.json").decode("utf-8")
          integrity = client.get("/api/account/integrity", headers={"Authorization": "Bearer " + token_a})
          assert integrity.status_code == 200 and integrity.json()["passed"], integrity.text
          audit_actions = {row["action"] for row in client.get("/api/admin/audit-logs", headers={"Authorization": "Bearer " + token_a}).json()}
          assert {"paper_uploaded", "personal_data_exported", "personal_data_integrity_checked"} <= audit_actions, audit_actions
          assert client.get(f"/api/papers/{private_paper_id}", headers={"Authorization": "Bearer " + token_b}).status_code == 404
          assert client.get("/api/areas", headers={"Authorization": "Bearer " + token_b}).json() == []
          assert len(client.get("/api/areas", headers={"Authorization": "Bearer " + token_a}).json()) >= 4
          login = client.post("/api/auth/login", json={"username": "account_alpha", "password": "TestPass#2026-Strong"})
          assert login.status_code == 200, login.text
          token_login = login.json()["access_token"]
          assert client.get("/api/auth/me", headers={"Authorization": "Bearer " + token_login}).json()["username"] == "account_alpha"
          assert client.get("/api/admin/users", headers={"Authorization": "Bearer " + token_login}).status_code == 200
          assert client.get("/api/admin/users", headers={"Authorization": "Bearer " + token_b}).status_code == 403
          assert client.get("/api/admin/audit-logs", headers={"Authorization": "Bearer " + token_login}).status_code == 200
          reset = client.post("/api/admin/users/" + str(second.json()["user"]["id"]) + "/reset-password",
                              headers={"Authorization": "Bearer " + token_login},
                              json={"temporary_password": "Temporary#2026-Strong"})
          assert reset.status_code == 200, reset.text
          assert client.get("/api/stats", headers={"Authorization": "Bearer " + token_b}).status_code == 401
          temp_login = client.post("/api/auth/login", json={"username": "account_beta", "password": "Temporary#2026-Strong"})
          assert temp_login.status_code == 200, temp_login.text
          assert client.get("/api/stats", headers={"Authorization": "Bearer " + temp_login.json()["access_token"]}).status_code == 403
          temp_change = client.post("/api/auth/change-password", headers={"Authorization": "Bearer " + temp_login.json()["access_token"]},
                                    json={"current_password": "Temporary#2026-Strong", "new_password": "BetaChanged#2026-Strong"})
          assert temp_change.status_code == 200, temp_change.text
          beta_relogin = client.post("/api/auth/login", json={"username": "account_beta", "password": "BetaChanged#2026-Strong"})
          assert beta_relogin.status_code == 200, beta_relogin.text
          token_b = beta_relogin.json()["access_token"]
          changed = client.post("/api/auth/change-password", headers={"Authorization": "Bearer " + token_login}, json={"current_password": "TestPass#2026-Strong", "new_password": "ChangedPass#2026-Strong"})
          assert changed.status_code == 200, changed.text
          assert client.get("/api/stats", headers={"Authorization": "Bearer " + token_login}).status_code == 401
          relogin = client.post("/api/auth/login", json={"username": "account_alpha", "password": "ChangedPass#2026-Strong"})
          assert relogin.status_code == 200, relogin.text
          token_login = relogin.json()["access_token"]
          disabled = client.patch("/api/admin/users/" + str(second.json()["user"]["id"]) + "/status",
                                  headers={"Authorization": "Bearer " + token_login}, json={"is_active": False})
          assert disabled.status_code == 200, disabled.text
          assert client.get("/api/stats", headers={"Authorization": "Bearer " + token_b}).status_code == 401
          assert client.get("/api/admin/audit-logs", headers={"Authorization": "Bearer " + token_login}).json()
          assert client.get("/api/stats").status_code == 401
          for _ in range(5):
              failed = client.post("/api/auth/login", json={"username": "account_alpha", "password": "wrong-password"})
              assert failed.status_code == 401
          limited = client.post("/api/auth/login", json={"username": "account_alpha", "password": "ChangedPass#2026-Strong"})
          assert limited.status_code == 429, limited.text
          if previous_bootstrap is None:
              os.environ.pop("ACADEMIC_BOOTSTRAP_CODE", None)
          else:
              os.environ["ACADEMIC_BOOTSTRAP_CODE"] = previous_bootstrap
          if previous_invite is None:
              os.environ.pop("ACADEMIC_REGISTRATION_CODE", None)
          else:
              os.environ["ACADEMIC_REGISTRATION_CODE"] = previous_invite
          assert AIReviewDraftInput.model_fields["evidence_ids"].metadata
          from backend.main import academic_ai_status
          assert "configured" in academic_ai_status()
          assert EvidenceDraftInput.model_fields["evidence_ids"].metadata
          from backend.main import extract_doi, guess_title
          assert extract_doi("DOI: 10.1234/example.2024") == "10.1234/example.2024"
          assert guess_title("页眉\n一个足够明确的论文题名\n正文", "paper.pdf") == "一个足够明确的论文题名"
          print("应用导入、分类、证据卡片、综述项目、Word导出接口、DOI和题名识别检查通过")
          PY

      - name: 备份、校验与恢复往返测试
        working-directory: academic-research
        run: |
          python - <<'PY'
          import json, os, sqlite3, subprocess, sys, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              db = root / "source.db"
              uploads = root / "uploads"
              uploads.mkdir()
              with sqlite3.connect(db) as conn:
                  conn.execute("CREATE TABLE sample (id INTEGER PRIMARY KEY, value TEXT)")
                  conn.execute("INSERT INTO sample(value) VALUES ('学术智库备份测试')")
              (uploads / "paper.txt").write_text("备份原文件测试", encoding="utf-8")
              env = os.environ.copy()
              env["ACADEMIC_DATABASE_URL"] = "sqlite:///" + str(db)
              backup_root = root / "backups"
              subprocess.run([sys.executable, "backup_data.py", "backup", "--output", str(backup_root), "--uploads", str(uploads)], env=env, check=True)
              backup_dir = next(backup_root.iterdir())
              subprocess.run([sys.executable, "backup_data.py", "verify", "--backup-dir", str(backup_dir)], env=env, check=True)
              restored_db = root / "restored.db"
              restored_uploads = root / "restored_uploads"
              subprocess.run([sys.executable, "backup_data.py", "restore", "--backup-dir", str(backup_dir), "--database", str(restored_db), "--uploads", str(restored_uploads), "--yes"], env=env, check=True)
              with sqlite3.connect(restored_db) as conn:
                  row = conn.execute("SELECT value FROM sample WHERE id=1").fetchone()
                  assert row and row[0] == "学术智库备份测试"
              assert (restored_uploads / "paper.txt").read_text(encoding="utf-8") == "备份原文件测试"
              for _ in range(2):
                  subprocess.run([sys.executable, "backup_data.py", "backup", "--output", str(backup_root), "--uploads", str(uploads)], env=env, check=True)
              subprocess.run([sys.executable, "backup_data.py", "prune", "--backup-root", str(backup_root), "--keep", "2"], env=env, check=True)
              assert len(list(backup_root.glob("academic-backup-*"))) == 2
              print("SQLite在线备份、上传归档、SHA-256校验及恢复往返测试通过")
          PY

      - name: SQLite迁移至PostgreSQL与原件复制测试
        working-directory: academic-research
        run: |
          python - <<'PY'
          import os, subprocess, sys, tempfile, uuid
          from pathlib import Path
          import fitz
          import psycopg
          from psycopg import sql
          from sqlalchemy.engine import make_url

          root = Path(tempfile.mkdtemp(prefix="academic-migration-ci-"))
          source_db = root / "source.sqlite3"
          uploads = root / "source_uploads"
          uploads.mkdir()
          pdf = fitz.open()
          pdf.new_page().insert_text((72, 72), "Migration fixture")
          (uploads / "source-paper.pdf").write_bytes(pdf.tobytes())
          pdf.close()
          source_env = os.environ.copy()
          source_env["ACADEMIC_DATABASE_URL"] = "sqlite:///" + source_db.as_posix()
          source_env["MIGRATION_UPLOAD_DIR"] = str(uploads)
          fixture = r"""
          import json, os
          from pathlib import Path
          from sqlalchemy import select
          from backend.main import SessionLocal, User, ResearchArea, Paper, EvidenceCard, ReviewProject, ReviewParagraph, password_digest
          upload = Path(os.environ["MIGRATION_UPLOAD_DIR"]) / "source-paper.pdf"
          with SessionLocal() as db:
              user = User(username="migration_owner", password_hash=password_digest("MigrationPass#2026"))
              db.add(user)
              db.flush()
              area = db.scalar(select(ResearchArea).limit(1))
              area.owner_id = user.id
              paper = Paper(owner_id=user.id, title="迁移验证论文", authors="测试作者",
                            file_name="source-paper.pdf", file_path=str(upload),
                            file_sha256="migration-fixture-hash", full_text="迁移全文")
              db.add(paper)
              db.flush()
              evidence = EvidenceCard(owner_id=user.id, paper_id=paper.id,
                                      claim="迁移证据论点", source_text="迁移原文摘录")
              db.add(evidence)
              db.flush()
              project = ReviewProject(owner_id=user.id, title="迁移综述", topic="迁移主题")
              db.add(project)
              db.flush()
              db.add(ReviewParagraph(owner_id=user.id, project_id=project.id,
                                     heading="迁移段落", content="迁移正文",
                                     evidence_ids=json.dumps([evidence.id])))
              db.commit()
          """
          subprocess.run([sys.executable, "-c", fixture], env=source_env, check=True)

          base_url = make_url(os.environ["ACADEMIC_DATABASE_URL"])
          database_name = "academic_migration_" + uuid.uuid4().hex[:10]
          with psycopg.connect(host=base_url.host, port=base_url.port or 5432,
              dbname="postgres", user=base_url.username, password=base_url.password, autocommit=True) as admin:
              with admin.cursor() as cursor:
                  cursor.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(database_name)))
          target_url = base_url.set(database=database_name).render_as_string(hide_password=False)
          migrated_uploads = root / "migrated_uploads"
          try:
              subprocess.run([sys.executable, "migrate_sqlite_to_postgres.py",
                  "--source-db", str(source_db), "--target-url", target_url,
                  "--uploads-source", str(uploads), "--uploads-destination", str(migrated_uploads)],
                  env=source_env, check=True)
              with psycopg.connect(host=base_url.host, port=base_url.port or 5432,
                  dbname=database_name, user=base_url.username, password=base_url.password) as connection:
                  with connection.cursor() as cursor:
                      for table in ("users", "papers", "evidence_cards", "review_projects", "review_paragraphs"):
                          cursor.execute(sql.SQL("SELECT COUNT(*) FROM {}").format(sql.Identifier(table)))
                          assert cursor.fetchone()[0] == 1, table
                      cursor.execute("SELECT file_path FROM papers WHERE title=%s", ("迁移验证论文",))
                      migrated_path = Path(cursor.fetchone()[0])
                      assert migrated_path == migrated_uploads / "source-paper.pdf"
                      assert migrated_path.read_bytes() == (uploads / "source-paper.pdf").read_bytes()
                      cursor.execute("SELECT COUNT(*) FROM research_areas WHERE owner_id IS NOT NULL")
                      assert cursor.fetchone()[0] == 1
              rerun = subprocess.run([sys.executable, "migrate_sqlite_to_postgres.py",
                  "--source-db", str(source_db), "--target-url", target_url],
                  env=source_env, capture_output=True, text=True)
              assert rerun.returncode != 0 and "并非空库" in rerun.stderr + rerun.stdout
              print("SQLite到PostgreSQL数据、外键关系、主键序列和上传原件迁移测试通过")
          finally:
              with psycopg.connect(host=base_url.host, port=base_url.port or 5432,
                  dbname="postgres", user=base_url.username, password=base_url.password, autocommit=True) as admin:
                  with admin.cursor() as cursor:
                      cursor.execute(sql.SQL("DROP DATABASE IF EXISTS {}").format(sql.Identifier(database_name)))
          PY

      - name: Docker镜像构建与容器健康检查
        run: |
          docker build -t academic-research-ci academic-research
          mkdir -p /tmp/academic-research-ci-data
          docker run -d --name academic-research-ci -p 8000:10000 \
            -v /tmp/academic-research-ci-data:/app/academic-research/data \
            academic-research-ci
          trap 'docker logs academic-research-ci || true; docker rm -f academic-research-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              echo "容器健康检查通过"
              exit 0
            fi
            sleep 2
          done
          echo "容器未能在限定时间内通过健康检查"
          exit 1
