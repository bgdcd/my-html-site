name: Build Task Three Tablet APK

on:
  push:
    branches: [main]
    paths:
      - 'task3-app-shell/**'
      - '.github/workflows/build-task-three-tablet.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle -p task3-app-shell assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task3-tablet-apk
          path: task3-app-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
