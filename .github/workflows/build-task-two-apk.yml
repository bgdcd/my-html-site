name: Build Task Two Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-task-two-apk.yml'
      - 'android-task-two/**'
      - '任务二.html'
      - 'word.png'
      - 'chizongai.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for launcher icon generation
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install image processing library
        run: python -m pip install Pillow

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Download the exact Task Two HTML and icon image word.png
        run: |
          mkdir -p android-task-two/app/src/main/assets
          curl -fL 'https://raw.githubusercontent.com/bgdcd/my-html-site/main/%E4%BB%BB%E5%8A%A1%E4%BA%8C.html' -o android-task-two/app/src/main/assets/task-two.html
          curl -fL 'https://raw.githubusercontent.com/bgdcd/my-html-site/main/chizongai.png' -o android-task-two/app/src/main/assets/chizongai.png
          curl -fL 'https://raw.githubusercontent.com/bgdcd/my-html-site/main/word.png' -o android-task-two/app/src/main/assets/word.png
          test -s android-task-two/app/src/main/assets/task-two.html
          test -s android-task-two/app/src/main/assets/chizongai.png
          test -s android-task-two/app/src/main/assets/word.png
          file android-task-two/app/src/main/assets/word.png

      - name: Generate Android launcher icons from word.png
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("android-task-two/app/src/main/assets/word.png")
          image = Image.open(source).convert("RGBA")
          side = min(image.width, image.height)
          left = (image.width - side) // 2
          top = (image.height - side) // 2
          image = image.crop((left, top, left + side, top + side))
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              out = Path(f"android-task-two/app/src/main/res/mipmap-{density}/ic_launcher.png")
              out.parent.mkdir(parents=True, exist_ok=True)
              image.resize((size, size), Image.Resampling.LANCZOS).save(out, format="PNG", optimize=True)
          print(f"Launcher icon generated from word.png (original dimensions: {image.width}x{image.height})")
          PY

      - name: Build debug APK
        working-directory: android-task-two
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-two-android-apk
          path: android-task-two/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
