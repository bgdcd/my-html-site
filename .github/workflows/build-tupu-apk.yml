name: Build Tiling Lab Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '密铺App/**'
      - 'tiling-lab-composite-lattice-fix.html'
      - '843019d4b08be0e48c4b83414c4040f0.jpg'
      - '.github/workflows/build-tupu-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare the exact latest Tiling Lab HTML and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '密铺App/app/src/main/assets' '密铺App/app/src/main/res/drawable'
          cp 'tiling-lab-composite-lattice-fix.html' '密铺App/app/src/main/assets/index.html'
          cp '843019d4b08be0e48c4b83414c4040f0.jpg' '密铺App/app/src/main/res/drawable/ic_launcher.jpg'
          test -s '密铺App/app/src/main/assets/index.html'
          test -s '密铺App/app/src/main/res/drawable/ic_launcher.jpg'
          grep -q '<title>密铺实验室</title>' '密铺App/app/src/main/assets/index.html'
          if grep -q '正在铺设第 ' '密铺App/app/src/main/assets/index.html'; then
            echo 'Unexpected tiling progress text found in bundled HTML.'
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: 密铺App
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 密铺实验室-安卓平板安装包
          path: 密铺App/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
