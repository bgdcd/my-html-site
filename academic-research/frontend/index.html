<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学术智库</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}.top{background:#152544;color:white;padding:22px max(22px,calc((100% - 1180px)/2))}.top h1{margin:0;font-size:25px}.top p{margin:7px 0 0;color:#c9d5eb}.wrap{max-width:1180px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:220px 1fr;gap:18px}.panel,.card{background:white;border:1px solid #e3e8f1;border-radius:14px;padding:18px;box-shadow:0 5px 18px #1c31500a}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:9px;color:#35425a;cursor:pointer;font-size:15px}.nav button.active,.nav button:hover{background:#eaf0fb;color:#1d4d91}.main h2{margin:0 0 15px;font-size:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat strong{font-size:27px;display:block;color:#1e4f91}.stat span,.muted{color:#748097;font-size:13px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}input,select{padding:10px 12px;border:1px solid #d7deea;border-radius:8px;font:inherit;min-width:0}input[type=text]{flex:1}button.primary{background:#2459a6;color:white;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}button.secondary{background:#edf2fa;color:#244b80;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.paper{padding:13px 0;border-bottom:1px solid #edf0f5}.paper:last-child{border:0}.paper b{display:block;margin-bottom:5px}.tag{display:inline-block;background:#eef3fb;color:#315987;border-radius:20px;padding:3px 8px;font-size:12px;margin:4px 4px 0 0}.hidden{display:none}.notice{background:#fff8e9;border:1px solid #f1dfb8;padding:12px;border-radius:9px;color:#75551a;font-size:13px;margin:12px 0}pre{white-space:pre-wrap;word-break:break-word;background:#f7f8fb;padding:12px;border-radius:8px;max-height:360px;overflow:auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<header class="top"><h1>学术智库</h1><p>真实文献管理 · 学术资料检索 · 研究知识积累</p></header>
<div class="wrap"><div class="grid">
<aside class="panel nav">
<button class="active" data-tab="overview">总览</button><button data-tab="library">我的文献库</button><button data-tab="external">外部文献检索</button><button data-tab="upload">上传论文</button><button data-tab="areas">研究领域管理</button>
<div class="notice">来源透明：外部接口元数据不等于全文。当前未接入知网、万方授权服务。</div>
</aside>
<main class="main">
<section id="overview" class="panel"><h2>研究资料总览</h2><div class="stats"><div class="card stat"><strong id="total">—</strong><span>文献总数</span></div><div class="card stat"><strong id="uploaded">—</strong><span>个人上传</span></div><div class="card stat"><strong id="pending">—</strong><span>待确认分类</span></div></div><p class="muted" id="health">正在连接数据库…</p><h3>研究领域</h3><div id="areaOverview"></div></section>
<section id="library" class="panel hidden"><h2>我的文献库</h2><div class="row"><input id="libraryQ" type="text" placeholder="检索题名、作者、摘要或全文"><button class="primary" onclick="loadPapers()">检索</button></div><div id="papers"></div></section>
<section id="external" class="panel hidden"><h2>外部文献检索</h2><p class="muted">调用 OpenAlex 或 Crossref 公开接口，显示接口真实返回结果。</p><div class="row"><input id="externalQ" type="text" placeholder="输入论文主题、关键词或题名"><select id="source"><option value="openalex">OpenAlex</option><option value="crossref">Crossref</option></select><button class="primary" onclick="searchExternal()">开始检索</button></div><div id="externalResults"></div></section>
<section id="upload" class="panel hidden"><h2>上传论文</h2><p>支持 PDF、DOCX，单个文件最大40MB。扫描版PDF若无文本层，当前版本可能无法提取文字。</p><div class="row"><input id="file" type="file" accept=".pdf,.docx"><button class="primary" onclick="uploadFile()">上传并解析</button></div><div id="uploadResult" class="muted"></div></section>
<section id="areas" class="panel hidden"><h2>研究领域管理</h2><p class="muted">第04领域保持空白；可在此添加你自己的方向。自动分类仅为初步建议，未命中文献进入待确认。</p><div id="areasList"></div><div class="row"><input id="areaName" type="text" placeholder="输入要新增的研究方向"><button class="primary" onclick="addArea()">新增领域</button></div></section>
</main></div></div>
<script>
const $=id=>document.getElementById(id);
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==b.dataset.tab));});
async function api(url,opts){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d}
async function refresh(){try{const [s,h,a]=await Promise.all([api('/api/stats'),api('/api/health'),api('/api/areas')]);$('total').textContent=s.total;$('uploaded').textContent=s.uploaded;$('pending').textContent=s.pending;$('health').textContent='数据库已连接 · 服务状态正常';$('areaOverview').innerHTML=a.map(x=>'<span class="tag">'+esc(x.name)+'</span>').join('');renderAreas(a)}catch(e){$('health').textContent='数据库连接失败：'+e.message}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadPapers(){try{const a=await api('/api/papers?q='+encodeURIComponent($('libraryQ').value));const areas=await api('/api/areas');$('papers').innerHTML=a.length?a.map(p=>'<div class="paper"><b>'+esc(p.title)+'</b><span class="muted">'+esc(p.authors)+' '+esc(p.journal)+' '+esc(p.year||'')+'</span><div><span class="tag">'+esc(p.source)+'</span><span class="tag">'+esc(p.fulltext_status)+'</span><span class="tag">'+esc(p.verification_status)+'</span></div><div class="row"><button class="secondary" onclick="showPaper('+p.id+')">查看详情</button><button class="secondary" onclick="verifyMetadata('+p.id+')">核验/编辑元数据</button>'+(p.file_name?'<button class="secondary" onclick="downloadOriginal('+p.id+')">下载原件</button>':'')+'<select id="paper-area-'+p.id+'" onchange="assignArea('+p.id+')"><option value="">待确认分类</option>'+areas.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div></div>').join(''):'暂无文献记录';a.forEach(p=>{const el=$('paper-area-'+p.id);if(el)el.value=p.area_id??''})}catch(e){$('papers').textContent=e.message}}
async function verifyMetadata(id){const p=await api('/api/papers/'+id);const title=prompt('题名（请对照原文核验）',p.title||'');if(title===null)return;const authors=prompt('作者',p.authors||'');if(authors===null)return;const journal=prompt('期刊/来源',p.journal||'');if(journal===null)return;const yearText=prompt('年份（可留空）',p.year||'');if(yearText===null)return;const doi=prompt('DOI（可留空）',p.doi||'');if(doi===null)return;const abstract=prompt('摘要（请区分原文摘要与自动提取候选）',p.abstract||'');if(abstract===null)return;const keywords=prompt('关键词',p.keywords||'');if(keywords===null)return;try{await api('/api/papers/'+id+'/metadata',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,authors,journal,year:yearText.trim()?Number(yearText):null,doi,abstract,keywords})});alert('元数据已保存，状态标记为人工核验');loadPapers();refresh()}catch(e){alert(e.message)}}
async function assignArea(id){const v=$('paper-area-'+id).value;try{await api('/api/papers/'+id+'/area',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({area_id:v?Number(v):null})});refresh()}catch(e){alert(e.message)}}
function downloadOriginal(id){window.open('/api/papers/'+id+'/file','_blank')}
async function showPaper(id){const p=await api('/api/papers/'+id);alert('题名：'+p.title+'\n作者：'+p.authors+'\n来源：'+p.source+'\n摘要：'+(p.abstract||'无')+'\n\n全文片段：\n'+(p.full_text||'未保存全文').slice(0,1800))}
async function uploadFile(){const f=$('file').files[0];if(!f){$('uploadResult').textContent='请先选择PDF或DOCX文件';return}const fd=new FormData();fd.append('file',f);$('uploadResult').textContent='正在上传和解析…';try{const d=await api('/api/upload',{method:'POST',body:fd});$('uploadResult').textContent='上传成功：'+d.title+'；提取字符数：'+d.characters_extracted+'；分类状态：'+d.classification;refresh()}catch(e){$('uploadResult').textContent='上传失败：'+e.message}}
async function searchExternal(){const q=$('externalQ').value.trim();if(q.length<2){$('externalResults').textContent='请输入至少2个字符';return}$('externalResults').textContent='正在查询真实外部接口…';try{const d=await api('/api/search/external?q='+encodeURIComponent(q)+'&source='+$('source').value);$('externalResults').innerHTML=d.results.map((p,i)=>'<div class="paper"><b>'+esc(p.title)+'</b><span class="muted">'+esc(p.authors)+' · '+esc(p.journal)+' · '+esc(p.year||'')+'</span><div class="muted">DOI：'+esc(p.doi)+'；'+esc(p.fulltext_status)+'</div><button class="secondary" onclick="saveExternal('+i+')">保存到我的文献库</button></div>').join('')||'接口没有返回匹配记录';window.lastResults=d.results}catch(e){$('externalResults').textContent='检索失败：'+e.message}}
async function saveExternal(i){try{const p=window.lastResults[i];const d=await api('/api/papers/external',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});alert(d.duplicate?'该文献已存在':'已保存到个人文献库');refresh()}catch(e){alert(e.message)}}
async function renderAreas(a){
 const options='<option value="">设为一级分类</option>'+a.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
 $('areasList').innerHTML=a.map(x=>'<div class="paper"><b>'+esc(x.name)+'</b><span class="muted">'+(x.is_placeholder?'预留空白分类':'分类编号：'+x.id)+'</span><div class="row"><button class="secondary" onclick="renameArea('+x.id+')">重命名</button><select id="parent-'+x.id+'">'+options+'</select><button class="secondary" onclick="moveArea('+x.id+')">调整层级</button><button class="secondary" onclick="mergeArea('+x.id+')">合并到…</button><button class="secondary" onclick="deleteArea('+x.id+')">删除</button></div></div>').join('');
 a.forEach(x=>{const el=$('parent-'+x.id);if(el)el.value=x.parent_id??''})
}
async function renameArea(id){const a=await api('/api/areas');const x=a.find(v=>v.id===id);const name=prompt('请输入新的分类名称',x?.name||'');if(!name?.trim())return;try{await api('/api/areas/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim(),parent_id:x.parent_id})});refresh()}catch(e){alert(e.message)}}
async function moveArea(id){const parent=$('parent-'+id).value;try{await api('/api/areas/'+id+'/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({parent_id:parent?Number(parent):null})});refresh()}catch(e){alert(e.message)}}
async function mergeArea(id){const a=await api('/api/areas');const choices=a.filter(x=>x.id!==id);const target=prompt('请输入要合并到的目标分类编号：\\n'+choices.map(x=>x.id+'：'+x.name).join('\\n'));if(!target)return;try{const d=await api('/api/areas/'+id+'/merge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_area_id:Number(target)})});alert('合并完成，迁移文献 '+d.moved_papers+' 篇');refresh()}catch(e){alert(e.message)}}
async function deleteArea(id){if(!confirm('确定删除该分类？有关联文献或下级分类时系统会阻止删除。'))return;try{await api('/api/areas/'+id,{method:'DELETE'});refresh()}catch(e){alert(e.message)}}
async function addArea(){const n=$('areaName').value.trim();if(!n)return;try{await api('/api/areas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})});$('areaName').value='';refresh()}catch(e){alert(e.message)}}
refresh();loadPapers();
</script></body></html>
