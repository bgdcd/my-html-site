apply plugin: 'com.android.application'

android {
    compileSdkVersion 32

    defaultConfig {
        applicationId "cn.sunshine.sandtable"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 1
        versionName "1.0-legacy"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
