<section class="panel"><div class="panel-title">自定义多边形</div><div style="font-size:12px;color:#59728c">拖动滑块改变边数（3—8条边）</div><div class="custom-axis"><span>3</span><input id="polySides" type="range" min="3" max="8" step="1" value="3" aria-label="自定义多边形边数"><span>8</span><output id="polySidesValue">3</output></div><div class="custom-preview" id="customPreviewDrag" title="按住此处，将图形拖到右侧画布"><svg id="customPreviewSvg" viewBox="0 0 240 100" role="img" aria-label="自定义多边形实时预览"><polygon id="customPreviewPolygon" points="120,12 72,82 168,82" fill="#ffad66" stroke="#d77828" stroke-width="2.5" stroke-linejoin="round"/></svg><strong id="customPreviewName">任意三角形</strong><small>拖动上方滑块，图形会立即变化</small></div><div style="font-size:11px;color:#1678dc;text-align:center;margin-top:7px;font-weight:700">按住上方图形预览，直接拖到右侧画布；选中后可拖动顶点改变形状</div><button class="tile-btn" id="autoTileCustomBtn" style="margin-top:8px">自动密铺验证</button><div id="tilingResult" style="font-size:11px;line-height:1.5;margin-top:6px;color:#49647e">调整图形后，点击验证能否尝试密铺</div></section>
<section class="panel"><div class="panel-title">功能工具</div><div class="tools"><button class="tool-btn danger" id="clearBtn">▣ 清空画布</button><button class="tool-btn" id="angleBtn">∠ 标注对应角</button><button class="tool-btn" id="degreeBtn">标注对应角度</button></div><div class="tool-row"><button class="tool-btn rotate-action" id="rotateBtn"><img class="rotate-img" id="rotateImg" alt=""> 旋转选中图形</button><button class="tool-btn" id="duplicateBtn">＋ 复制选中图形</button></div><div class="tool-row"><button class="tool-btn" id="deleteBtn">⌫ 删除选中</button><button class="tool-btn" id="undoBtn">↶ 撤销</button></div><div style="margin-top:10px;font-size:11px;font-weight:800">图形颜色</div><div class="colors" style="margin-top:7px"><button class="swatch active" data-color="#ff8588" style="background:#ff8588"></button><button class="swatch" data-color="#71c8f2" style="background:#71c8f2"></button><button class="swatch" data-color="#8fdaa1" style="background:#8fdaa1"></button><button class="swatch" data-color="#ffc84d" style="background:#ffc84d"></button><button class="swatch" data-color="#c99bf5" style="background:#c99bf5"></button><button class="swatch" data-color="#52d4e9" style="background:#52d4e9"></button></div></section></aside>
<main class="board-wrap" id="boardWrap"><div class="board-tools"><button id="snapBtn">🧲 吸附：开</button><button id="gridBtn">▦ 网格：开</button><button id="speedBtn">🐢 铺设速度：慢</button><button id="fullBtn">⛶ 画布全屏</button></div><div class="toast" id="toast"></div><svg id="board" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-label="图形密铺画布"><defs><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#d9edff" stroke-width="1"/></pattern></defs><rect id="bg" width="1200" height="800" fill="url(#gridPattern)"/><g id="pieces"></g><g id="labels"></g></svg><div class="zoom"><button id="zoomIn">＋</button><div class="zoom-label" id="zoomLabel">100%</div><button id="zoomOut">−</button></div><div class="board-hint" id="hint">拖拽图形到画布；选中后拖旋转图标可旋转，拖蓝点可缩放</div></main></div><footer class="footer"><span>数学探究 · 图形密铺</span><span>触屏、鼠标均可操作</span></footer></div>
<script>
(()=>{
// 旋转图标：把你的图标放在这里（图片路径如 'rotate.png'，或 base64 data:image/png;base64,...）
const ROTATE_ICON_SRC='';
const DEFAULT_ROT='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#2585ed"/><path d="M22.5 13A7.5 7.5 0 1 0 23 17" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M24 7.5v6h-6z" fill="#fff"/></svg>');
const ROT=ROTATE_ICON_SRC||DEFAULT_ROT;
const NS='http://www.w3.org/2000/svg',$=s=>document.getElementById(s),board=$('board'),pieces=$('pieces'),labels=$('labels'),bg=$('bg'),wrap=$('boardWrap'),toast=$('toast');
const PI=Math.PI,R=PI/180,mod=a=>((a%360)+360)%360;
const reg=(n,r,off)=>Array.from({length:n},(_,i)=>[+(Math.cos((off+i*360/n)*R)*r).toFixed(3),+(Math.sin((off+i*360/n)*R)*r).toFixed(3)]);
const shapes={
 equilateral:{name:'正三角形',pts:reg(3,48,-90),color:'#ff8588'},
 rightTriangle:{name:'直角三角形',pts:[[-38,-34],[-38,34],[38,34]],color:'#71c8f2'},
 obtuseTriangle:{name:'钝角三角形',pts:[[-50,22],[46,22],[-20,-10]],color:'#8fdaa1'},
 square:{name:'正方形',pts:[[-35,-35],[35,-35],[35,35],[-35,35]],color:'#ffc84d'},
 parallelogram:{name:'平行四边形',pts:[[-24,-34],[45,-34],[24,34],[-45,34]],color:'#c99bf5'},
 quad:{name:'不规则四边形',pts:[[-50,-25],[10,-46],[48,18],[-22,40]],color:'#f49bb7'},
 pentagon:{name:'正五边形',pts:reg(5,43,-90),color:'#52d4e9'},
 hexagon:{name:'正六边形',pts:reg(6,48,0),color:'#b49af5'},
 custom:{name:'自定义多边形',pts:[[-42,22],[0,-42],[42,22]],color:'#ffad66'},
 tile:{name:'密铺图形',pts:[],color:'#ccc'}
};
let id=1,selected=null,selectedCorners=new Map(),snap=true,showGrid=true,showAngles=false,showDegrees=false,zoom=1,history=[];
function el(t,a={}){const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n}
function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>toast.classList.remove('show'),2400)}
function boardPoint(e){const p=board.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(board.getScreenCTM().inverse());return{x:q.x,y:q.y}}
const snapv=v=>snap?Math.round(v/5)*5:v;
const info=g=>({x:+g.dataset.x,y:+g.dataset.y,r:+g.dataset.r,s:+g.dataset.s||1});
const save=()=>{history.push(pieces.innerHTML);if(history.length>40)history.shift()};
const pointsFor=g=>g.dataset.customPts?JSON.parse(g.dataset.customPts):shapes[g.dataset.shape].pts;
function shade(h,d=-35){const n=parseInt(h.slice(1),16),c=v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0');return'#'+c((n>>16)+d)+c(((n>>8)&255)+d)+c((n&255)+d)}
const circled=i=>['①','②','③','④','⑤','⑥','⑦','⑧'][i]||String(i+1);
// ---------- 几何 ----------
const area=p=>{let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return a/2};
// 每个顶点的真实内角（凹多边形的优角也正确）及内角起始方向
function interior(p){const n=p.length,cw=area(p)<0;return p.map((b,i)=>{const a=p[(i+n-1)%n],c=p[(i+1)%n],a1=Math.atan2(c[1]-b[1],c[0]-b[0]),a2=Math.atan2(a[1]-b[1],a[0]-b[0]),s=cw?a2:a1,e=cw?a1:a2;return{ang:mod((e-s)/R),start:s/R}})}
function inP(p,q){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>q[1])!==(b[1]>q[1])&&q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function isSimple(p){const n=p.length,o=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;const a=p[i],b=p[(i+1)%n],c=p[j],d=p[(j+1)%n];if(o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0)return false}return Math.abs(area(p))>50}
function segD(q,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((q[0]-a[0])*dx+(q[1]-a[1])*dy)/(dx*dx+dy*dy||1)));return Math.hypot(q[0]-a[0]-t*dx,q[1]-a[1]-t*dy)}
const ap=(T,p)=>[T[0]*p[0]+T[2]*p[1]+T[4],T[1]*p[0]+T[3]*p[1]+T[5]];
const mul=(T,S)=>[T[0]*S[0]+T[2]*S[1],T[1]*S[0]+T[3]*S[1],T[0]*S[2]+T[2]*S[3],T[1]*S[2]+T[3]*S[3],T[0]*S[4]+T[2]*S[5]+T[4],T[1]*S[4]+T[3]*S[5]+T[5]];
function worldPts(g){const t=info(g),r=t.r*R,c=Math.cos(r),s=Math.sin(r);return pointsFor(g).map(p=>[t.x+t.s*(p[0]*c-p[1]*s),t.y+t.s*(p[0]*s+p[1]*c)])}
// ---------- 画布上的图形 ----------
function bind(g){g.addEventListener('pointerdown',startMove);g.addEventListener('click',e=>{e.stopPropagation();select(g);refresh()})}
function chooseCorner(g,i){const key=g.dataset.id+':'+i;if(selectedCorners.has(key))selectedCorners.delete(key);else selectedCorners.set(key,{g,i});showAngles=false;showDegrees=false;$('angleBtn').textContent='∠ 标注对应角';$('degreeBtn').textContent='标注对应角度';if(selected!==g){const old=selected;selected=g;if(old&&old.isConnected)redraw(old);pieces.appendChild(g);redraw(g);syncCustomPreview(g)}refresh()}
function makePiece(shape,x,y,fill,r,s,pts,exact){const g=el('g',{class:'piece','data-id':id++,'data-shape':shape,'data-x':exact?x:snapv(x),'data-y':exact?y:snapv(y),'data-r':r,'data-s':s});if(pts)g.dataset.customPts=JSON.stringify(pts);g.appendChild(el('polygon',{points:(pts||shapes[shape].pts).map(p=>p.join(',')).join(' '),fill,stroke:shade(fill),'stroke-width':2,'stroke-linejoin':'round'}));bind(g);pieces.appendChild(g);return g}
function add(shape,x=600,y=400,fill,r=0,s=null,record=true,pts=null){if(record)save();const g=makePiece(shape,x,y,fill||shapes[shape].color,r,s===null?1.28:s,pts||(shape==='custom'?shapes.custom.pts.map(a=>a.slice()):null));select(g);refresh();return g}
function redraw(g){const t=info(g);g.setAttribute('transform',`translate(${t.x} ${t.y}) rotate(${t.r}) scale(${t.s})`);g.querySelectorAll('.control').forEach(n=>n.remove());if(g!==selected)return;const pts=pointsFor(g),k=1/t.s,top=pts.reduce((a,p)=>p[1]<a[1]?p:a,pts[0]),right=pts.reduce((a,p)=>p[0]>a[0]?p:a,pts[0]),c=el('g',{class:'control'});
 const rot=el('g',{transform:`translate(0 ${top[1]}) scale(${k})`,class:'rot-control',cursor:'grab'});rot.appendChild(el('line',{x1:0,y1:-3,x2:0,y2:-22,stroke:'#2585ed','stroke-width':2,'pointer-events':'none'}));rot.appendChild(el('image',{href:ROT,x:-15,y:-52,width:30,height:30}));rot.addEventListener('pointerdown',startRotate);c.appendChild(rot);
 const sh=el('g',{transform:`translate(${right[0]} ${right[1]}) scale(${k})`});const sc=el('circle',{cx:8,cy:8,r:7,fill:'#1678ed',class:'handle'});sc.addEventListener('pointerdown',startScale);sh.appendChild(sc);c.appendChild(sh);
 if(g.dataset.shape==='custom')pts.forEach((p,i)=>{const vg=el('g',{transform:`translate(${p[0]} ${p[1]}) scale(${k})`});const vh=el('circle',{cx:0,cy:0,r:6,fill:'#fff',stroke:'#e85b00','stroke-width':2.2,cursor:'move'});vh.addEventListener('pointerdown',ev=>startVertex(ev,g,i));vg.appendChild(vh);c.appendChild(vg)});
 g.appendChild(c)}
function startVertex(ev,g,i){ev.stopPropagation();ev.preventDefault();if(selected!==g)select(g);save();const startId=ev.pointerId;let dragging=true;const mv=m=>{if(!dragging)return;if(m.pointerId!==undefined&&startId!==undefined&&m.pointerId!==startId)return;const ctm=g.getScreenCTM();if(!ctm)return;const pt=board.createSVGPoint();pt.x=m.clientX;pt.y=m.clientY;const q=pt.matrixTransform(ctm.inverse());const arr=pointsFor(g).map(a=>a.slice());arr[i]=[Math.round(q.x),Math.round(q.y)];g.dataset.customPts=JSON.stringify(arr);g.querySelector('polygon').setAttribute('points',arr.map(a=>a.join(',')).join(' '));redraw(g);syncCustomPreview(g);refresh()};const up=m=>{if(m.pointerId!==undefined&&startId!==undefined&&m.pointerId!==startId)return;dragging=false;window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);syncCustomPreview(g);refresh()};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up)}
function select(g){const old=selected;selected=g;if(old&&old!==g)redraw(old);if(g){pieces.appendChild(g);redraw(g);syncCustomPreview(g)}refresh();$('hint').textContent=g?'已选中'+shapes[g.dataset.shape].name+'：拖动移动，拖旋转图标旋转，拖蓝点缩放'+(g.dataset.shape==='custom'?'，拖白色顶点改变形状':''):'把图形拖到画布；选中后可旋转、缩放'}
// ---------- 标注（画在世界坐标里，大小固定，落在各自的角内） ----------
function vgroups(){const gs=[];for(const g of pieces.children){const w=worldPts(g),inn=interior(w);w.forEach((p,i)=>{let k=gs.find(o=>Math.hypot(o.x-p[0],o.y-p[1])<2.5);if(!k){k={x:p[0],y:p[1],it:[]};gs.push(k)}k.it.push(item(g,w,inn,i))})}return gs}
function item(g,w,inn,i){const n=w.length,p=w[i],pv=w[(i+n-1)%n],nx=w[(i+1)%n];return{g,i,s:inn[i].start,a:inn[i].ang,me:Math.min(Math.hypot(p[0]-pv[0],p[1]-pv[1]),Math.hypot(p[0]-nx[0],p[1]-nx[1]))}}
function closed(k){if(k.it.length<2||new Set(k.it.map(o=>o.g)).size<k.it.length)return false;if(Math.abs(k.it.reduce((t,o)=>t+o.a,0)-360)>2)return false;const it=[...k.it].sort((a,b)=>mod(a.s)-mod(b.s));return it.every((o,i)=>{const nx=it[(i+1)%it.length];return Math.abs(((mod(nx.s)-mod(o.s)-o.a)+540)%360-180)<4})}
const gcols=['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00acc1','#6d4c41','#d81b60'];
// 画一个顶点：同一顶点处所有图形的小圆弧用同一半径、首尾相接（凑够 360° 就是一个整圆），角度文字各放在自己的角里，彼此错开
function drawVertex(x,y,items,own,numbers,degs){const m=items.length,ar=Math.min(13,.32*Math.min(...items.map(o=>o.me))),so=[...items].sort((p,q)=>mod(p.s)-mod(q.s));let d=ar+9;
 if(m>1)for(let k=0;k<m;k++){const p=so[k],q=so[(k+1)%m];let sp=mod((q.s+q.a/2)-(p.s+p.a/2));if(!sp)sp=360;d=Math.max(d,Math.min(46,15/Math.sin(Math.min(sp,170)*R/2)))}
 so.forEach((o,k)=>{const mine=!own||o.g===own,mid=(o.s+o.a/2)*R,num=String(Math.round(o.a)),tw=(numbers?9:0)+(degs?(num.length+1)*5.4:0),key=o.g.dataset.id+':'+o.i;
  if(degs&&o.a<359){const s0=o.s*R,e=(o.s+o.a)*R,arc=el('path',{d:`M ${x+ar*Math.cos(s0)} ${y+ar*Math.sin(s0)} A ${ar} ${ar} 0 ${o.a>180?1:0} 1 ${x+ar*Math.cos(e)} ${y+ar*Math.sin(e)}`,class:'arc','data-corner-key':key,style:`stroke:${gcols[k%8]};stroke-width:${mine&&own?2.6:1.7};pointer-events:stroke;cursor:pointer`});arc.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();chooseCorner(o.g,o.i)});labels.appendChild(arc)}
  else if(degs){const arc=el('circle',{cx:x,cy:y,r:ar,class:'arc','data-corner-key':key,style:'stroke:'+gcols[0]+';pointer-events:stroke;cursor:pointer'});arc.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();chooseCorner(o.g,o.i)});labels.appendChild(arc)}
  // 只标序号时，把序号放在该角自己的内角平分线上且靠近顶点，避免共享顶点处被统一推远、看起来对应错角
  const di=numbers&&!degs?Math.min(Math.max(10,ar+4),Math.max(8,o.me*.34)):Math.min(Math.max(d,(tw/2+3)/Math.sin(Math.max(15,Math.min(o.a,170))*R/2)),Math.max(ar+8,o.me*.62)),t=el('text',{x:x+Math.cos(mid)*di,y:y+Math.sin(mid)*di+3.5,'text-anchor':'middle',class:'lbl','data-corner-key':key,style:'pointer-events:all;cursor:pointer'});
  t.addEventListener('click',ev=>{ev.stopPropagation();ev.preventDefault();chooseCorner(o.g,o.i)});
  if(numbers){const sp=el('tspan',{class:'lb-n'});sp.textContent=circled(o.i);t.appendChild(sp)}
  if(degs){const sp=el('tspan',{class:mine?'lb-d':'lb-o'});sp.textContent=num+'°';t.appendChild(sp)}labels.appendChild(t)})}
function refresh(){labels.innerHTML='';const ps=[...pieces.children];
 // 用每个角自身的透明扇形作为点击热区，点击哪个图形的角就只选择该图形的该角；不再用共享顶点的“最近点”猜测
 for(const g of ps){const wp=worldPts(g),inn=interior(wp);if(g===selected&&g.dataset.shape==='custom')continue;wp.forEach((p,i)=>{const a=inn[i],rad=Math.min(24,Math.max(14,Math.min(Math.hypot(p[0]-wp[(i+wp.length-1)%wp.length][0],p[1]-wp[(i+wp.length-1)%wp.length][1]),Math.hypot(p[0]-wp[(i+1)%wp.length][0],p[1]-wp[(i+1)%wp.length][1]))*.32)),steps=Math.max(3,Math.ceil(a.ang/12)),pts=[[p[0],p[1]]];for(let j=0;j<=steps;j++){const ang=(a.start+a.ang*j/steps)*R;pts.push([p[0]+rad*Math.cos(ang),p[1]+rad*Math.sin(ang)])}const hit=el('polygon',{points:pts.map(v=>v.join(',')).join(' '),fill:'#fff','fill-opacity':0.001,stroke:'none','pointer-events':'all',cursor:'pointer'});hit.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();chooseCorner(g,i)});labels.appendChild(hit)})}
 // 批量标注不设图形数量上限，密铺完成后仍可标注全部顶点
 if(showAngles||showDegrees){for(const k of vgroups())drawVertex(k.x,k.y,k.it,null,showAngles,showDegrees);return}
 // 单角模式只绘制用户选中的这个角，不顺带显示同一顶点周围其他角
 for(const {g,i} of selectedCorners.values()){if(!g.isConnected)continue;const wp=worldPts(g),inn=interior(wp),p=wp[i];drawVertex(p[0],p[1],[item(g,wp,inn,i)],g,true,true)}
}
// ---------- 移动 / 旋转 / 缩放 ----------
function magnetize(g){if(!snap)return;const feats=h=>{const p=worldPts(h),o=p.slice();p.forEach((a,i)=>{const b=p[(i+1)%p.length];o.push([(a[0]+b[0])/2,(a[1]+b[1])/2])});return o},mine=feats(g);let best=null;for(const o of pieces.children){if(o===g)continue;for(const a of mine)for(const b of feats(o)){const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(!best||d<best.d)best={d,dx:b[0]-a[0],dy:b[1]-a[1]}}}if(best&&best.d<=38*1200/Math.max(1,board.getBoundingClientRect().width)){g.dataset.x=+g.dataset.x+best.dx;g.dataset.y=+g.dataset.y+best.dy}}
function startMove(e){if(e.button!==undefined&&e.button!==0)return;if(e.target.closest('.control'))return;e.stopPropagation();const g=e.currentTarget;select(g);const p=boardPoint(e),t=info(g),cx0=e.clientX,cy0=e.clientY;let moved=false;try{g.setPointerCapture(e.pointerId)}catch{}const mv=ev=>{if(!moved){if(Math.hypot(ev.clientX-cx0,ev.clientY-cy0)<5)return;moved=true;save()}const q=boardPoint(ev);g.dataset.x=snapv(t.x+q.x-p.x);g.dataset.y=snapv(t.y+q.y-p.y);magnetize(g);redraw(g);refresh()};const up=()=>{g.removeEventListener('pointermove',mv);refresh();if(moved)checkAssembled()};g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up,{once:true})}
const edgeAng=w=>w.map((p,i)=>{const q=w[(i+1)%w.length];return Math.atan2(q[1]-p[1],q[0]-p[0])/R});

$('degreeBtn').onclick=()=>{showDegrees=!showDegrees;showAngles=false;selectedCorners.clear();$('degreeBtn').textContent=showDegrees?'隐藏对应角度':'标注对应角度';$('angleBtn').textContent='∠ 标注对应角';refresh();};
$('rotateBtn').onclick=()=>{if(!selected)return say('请先选中一个图形');save();selected.dataset.r=(+selected.dataset.r+15)%360;redraw(selected);refresh();checkAssembled()};
$('duplicateBtn').onclick=()=>{if(!selected)return say('请先选中图形');const t=info(selected),s=selected;add(s.dataset.shape,t.x+45,t.y+35,s.querySelector('polygon').getAttribute('fill'),t.r,t.s,true,s.dataset.customPts?JSON.parse(s.dataset.customPts):null)};
$('deleteBtn').onclick=()=>{if(!selected)return say('请先选中图形');save();selected.remove();selected=null;refresh()};
$('undoBtn').onclick=()=>{if(!history.length)return say('没有可撤销的操作');anim++;animSkip=null;pieces.innerHTML=history.pop();selected=null;[...pieces.children].forEach(g=>{bind(g);redraw(g)});refresh()};
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));if(selected){save();const p=selected.querySelector('polygon');p.setAttribute('fill',b.dataset.color);p.setAttribute('stroke',shade(b.dataset.color))}});
$('snapBtn').onclick=()=>{snap=!snap;$('snapBtn').textContent=snap?'🧲 吸附：开':'🧲 吸附：关'};
$('gridBtn').onclick=()=>{showGrid=!showGrid;bg.style.display=showGrid?'':'none';$('gridBtn').textContent=showGrid?'▦ 网格：开':'▦ 网格：关'};
$('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await wrap.requestFullscreen();else await document.exitFullscreen()}catch{say('当前浏览器暂不支持画布全屏')}};
function setZoom(z){zoom=Math.max(.5,Math.min(2.4,z));const w=1200/zoom,h=800/zoom;board.setAttribute('viewBox',`${(1200-w)/2} ${(800-h)/2} ${w} ${h}`);$('zoomLabel').textContent=Math.round(zoom*100)+'%'}
$('zoomIn').onclick=()=>setZoom(zoom+.1);$('zoomOut').onclick=()=>setZoom(zoom-.1);
board.addEventListener('click',e=>{if(e.target===bg||e.target===board){if(animSkip)return animSkip();const o=selected;selected=null;if(o)redraw(o);refresh()}});
board.addEventListener('wheel',e=>{e.preventDefault();if(selected&&(e.shiftKey||e.ctrlKey)){save();selected.dataset.s=Math.max(.25,Math.min(4,info(selected).s*(e.deltaY<0?1.08:.92)));redraw(selected);refresh()}else setZoom(zoom*(e.deltaY<0?1.04:.96))},{passive:false});
$('speedBtn').onclick=()=>{speedI=(speedI+1)%3;$('speedBtn').textContent='🐢 铺设速度：'+SPEEDS[speedI][0]};
window.__tiling={decomp,pose,layTiles,solve,norm,canSum360,interior,isSimple,shapes,tileWith};
})();
</script></body></html>
